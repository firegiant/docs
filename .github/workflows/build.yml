name: Build Docs

on: [pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.16.1
      with:
        node-version: 24
        cache: true
        run-install: true
    - name: Build
      run: vp run build
